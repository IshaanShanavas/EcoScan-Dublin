<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoScan Dublin - Recycling Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; background: #f4f9f4; }
        .container { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h1 { color: #1b5e20; margin-top: 0; }
        .upload-area { border: 2px dashed #81c784; padding: 25px; text-align: center; border-radius: 8px; background: #f1f8e9; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .btn-upload { display: inline-block; padding: 10px 20px; background: #2e7d32; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.btn-submit { width: 100%; padding: 14px; background: #1b5e20; color: white; border: none; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.btn-submit:disabled { background: #a5d6a7; cursor: not-allowed; }
        #imgPreview { max-width: 100%; max-height: 220px; margin-top: 15px; border-radius: 6px; display: none; }
        .result-card { background: #e8f5e9; border-left: 6px solid #2e7d32; padding: 20px; border-radius: 6px; margin-top: 20px; }
        .bin-badge { display: inline-block; padding: 6px 14px; background: #1b5e20; color: #fff; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 12px; text-transform: uppercase; }
        .error-banner { background: #ffebee; border-left: 6px solid #c62828; color: #b71c1c; padding: 15px; margin-top: 20px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>♻️ EcoScan Dublin</h1>
    <p>Upload a photo of any household item to identify its official Dublin recycling rules.</p>

    <!-- FILE UPLOAD CONTAINER -->
    <div class="upload-area">
        <label for="fileInput" class="btn-upload">📸 SELECT OR TAKE PHOTO</label>
        <input type="file" id="fileInput" accept="image/*" onchange="handleImageSelection()">
        <br>
        <img id="imgPreview" src="#" alt="Image Preview">
    </div>

    <button id="scanBtn" class="btn-submit" onclick="submitEcoScan()" disabled>ANALYZE ITEM & GET RULES</button>

    <div id="outputArea"></div>
</div>

<script>
    let base64ImageString = "";

    // CONVERT FILE TO BASE64 FOR BACKEND TRANSMISSION
    function handleImageSelection() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            base64ImageString = e.target.result;
            const preview = document.getElementById('imgPreview');
            preview.src = base64ImageString;
            preview.style.display = 'block';
            document.getElementById('scanBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    // SUBMIT IMAGE TO FLASK BACKEND ROUTE
    async function submitEcoScan() {
        const output = document.getElementById('outputArea');
        const btn = document.getElementById('scanBtn');
        btn.disabled = true;
        output.innerHTML = '<p>🔍 ANALYZING IMAGE AGAINST DUBLIN WASTE STANDARDS...</p>';

        try {
            const response = await fetch('http://127.0.0.1:5000/api/ecoscan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64ImageString })
            });

            const result = await response.json();

            if (response.ok && result.status === 'success') {
                const data = result.data;
                
                // RENDER STRUCTURED JSON DATA INTO HTML CARD
                output.innerHTML = `
                    <div class="result-card">
                        <span class="bin-badge">🗑️ ${data.bin_type}</span>
                        <h2>${data.item_name}</h2>
                        <p><strong>CATEGORY:</strong> ${data.item_category}</p>
                        <h3>DISPOSAL STEPS:</h3>
                        <ul>${data.disposal_steps.map(step => `<li>${step}</li>`).join('')}</ul>
                        <p><strong>💡 DUBLIN LOCAL TIP:</strong> ${data.dublin_local_tip}</p>
                    </div>
                `;
            } else {
                output.innerHTML = `<div class="error-banner">⚠️ ${result.message || 'FAILED TO PROCESS IMAGE.'}</div>`;
            }
        } catch (err) {
            output.innerHTML = `<div class="error-banner">⚠️ COULD NOT CONNECT TO BACKEND SERVER. IS FLASK RUNNING ON PORT 5000?</div>`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
